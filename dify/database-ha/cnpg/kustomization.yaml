apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dify

# NOTE: secrets are NOT here on purpose — they are created from environment
# variables by ./apply.sh so credentials never live in git. Create the three
# secrets (dify-postgres-superuser / -app / -backup) first if you apply this
# declaratively instead.
resources:
  - cluster.yaml
  - pooler.yaml
  - backup.yaml
