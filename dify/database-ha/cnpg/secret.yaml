---
# ============================================================================
# Credentials for the CloudNativePG-managed Postgres cluster.
#
# THIS FILE IS A TEMPLATE. Every value below is a placeholder.
# Replace the passwords before applying, and prefer keeping the real values
# out of git (sealed-secrets / external-secrets / SOPS) for anything real.
#
# Generated passwords, e.g.:
#   openssl rand -base64 24
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: dify-postgres-superuser
  namespace: dify
type: Opaque
stringData:
  # superuser "postgres" — used by CNPG internals and by the migration runbook
  username: postgres
  password: "CHANGE_ME_SUPERUSER"
---
# Application role. Owns both Dify databases so `flask db upgrade` (api) and
# the plugin-daemon migrations keep working without superuser access.
apiVersion: v1
kind: Secret
metadata:
  name: dify-postgres-app
  namespace: dify
type: Opaque
stringData:
  username: dify
  password: "CHANGE_ME_APP_PASSWORD"
  dbname: dify
---
# S3-compatible credentials for WAL archiving / base backups (barman-cloud).
# Not needed if you use the volumeSnapshots backup method instead.
apiVersion: v1
kind: Secret
metadata:
  name: dify-postgres-backup
  namespace: dify
type: Opaque
stringData:
  accessKeyId: "CHANGE_ME_S3_ACCESS_KEY"
  secretAccessKey: "CHANGE_ME_S3_SECRET_KEY"
  # Only needed for non-AWS S3 (MinIO, Aliyun OSS, ...): set endpointURL in
  # cluster.yaml accordingly. AWS S3: set AWS_REGION, leave endpointURL empty.
  AWS_REGION: ""
  endpointURL: ""
